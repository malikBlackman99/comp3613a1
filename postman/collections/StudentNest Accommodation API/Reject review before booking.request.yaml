$kind: http-request
url: "{{baseUrl}}/api/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "listing_id": {{listingId}},
      "rating": 5,
      "comment": "Review before booking should be rejected"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('unbooked student cannot review the listing', function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 6000
