{% extends "authenticated-base.html" %}
{% block title %}Reviews{% endblock %}

{% block subpage_content %}
<div class="page-shell">
  <div class="section-header">
    <div>
      <p class="section-label mb-1">Leave Review</p>
      <h1 class="section-title mb-0">Share your experience</h1>
    </div>
  </div>

  <div class="detail-layout">
    <div class="form-card">
      <form method="POST" action="{{ url_for('submit_review') }}">
        <div class="form-group">
          <label for="listing_id">Select property</label>
          <select id="listing_id" name="listing_id" required>
            {% for listing in listings %}
            <option value="{{ listing.id }}">{{ listing.title }} · {{ listing.city }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="rating">Rating</label>
          <select id="rating" name="rating" required>
            <option value="5">★★★★★</option>
            <option value="4">★★★★☆</option>
            <option value="3">★★★☆☆</option>
            <option value="2">★★☆☆☆</option>
            <option value="1">★☆☆☆☆</option>
          </select>
        </div>
        <div class="form-group">
          <label for="comment">Review</label>
          <textarea id="comment" name="comment" rows="5" placeholder="Tell other students what it was like..."></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Leave review</button>
      </form>
    </div>

    <div class="profile-stack">
      {% for review in user_reviews %}
      <div class="review-item">
        <div class="rating-stars">{'★' * review.rating}</div>
        <p class="mb-0">{{ review.comment }}</p>
      </div>
      {% else %}
      <div class="alert alert-light mb-0">Your reviews will appear here.</div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
